<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#224B3A">
<meta name="robots" content="noindex, nofollow">
<title>Control · Acreedores</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF0EA;--card:#FFFFFF;--line:#E0E4DB;--ink:#17261E;--muted:#5D6A61;
  --green:#224B3A;--green2:#2F6A4F;--greenSoft:#E2ECE5;
  --gold:#A47A25;--goldSoft:#F6EEDC;--red:#B42B22;--redDark:#7C1F1A;--redSoft:#F9E5E2;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,Roboto,"Segoe UI",sans-serif;font-size:16px;line-height:1.4}
body{padding-bottom:calc(92px + env(safe-area-inset-bottom))}
body.sin-nav{padding-bottom:24px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
#app{max-width:560px;margin:0 auto;padding:12px 18px 24px}
h2,h3{margin:0}
.muted{color:var(--muted)}
.chico{font-size:14px}
.rojo{color:var(--red)}
/* encabezado */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 0 18px}
.marca{display:flex;align-items:center;gap:12px;min-width:0}
.marca .logo{width:46px;height:46px;flex:none}
.marca h1{margin:0;font-size:30px;font-weight:800;color:var(--green);letter-spacing:-.02em;line-height:1.05}
.marca p{margin:3px 0 0;color:var(--muted);font-size:14px}
.acc{display:flex;gap:7px;flex:none}
.redondo{width:44px;height:44px;border-radius:50%;background:#fff;border:1px solid var(--line);display:grid;place-items:center;padding:0}
.pill-al{height:44px;padding:0 14px;border-radius:22px;background:#fff;border:1px solid var(--line);display:flex;align-items:center;gap:8px;font-weight:600}
.pill-al i{width:9px;height:9px;border-radius:50%;background:var(--red);display:block}
.pill-al.cero i{background:var(--green2)}
.volver{display:flex;align-items:center;gap:6px;background:none;border:0;padding:8px 0;color:var(--green);font-weight:600;font-size:16px}
/* títulos */
.tit{font-size:26px;font-weight:700;margin:6px 0 16px;letter-spacing:-.01em}
.sec-tit{display:flex;justify-content:space-between;align-items:center;margin:26px 0 12px;gap:10px}
.sec-tit h2{font-size:20px;font-weight:700}
.sub{color:var(--muted);font-size:16px;margin:26px 0 12px}
.link{background:none;border:0;color:var(--green);font-weight:600;padding:6px 0}
.grupo{font-weight:600;font-size:16px;margin:22px 0 10px}
.grupo.mora{color:var(--red)}.grupo.hoy{color:var(--green)}.grupo.prox{color:var(--gold)}
/* tarjetas */
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:20px 18px;margin-bottom:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tarjeta{border-radius:24px;padding:18px 16px;min-height:148px;display:flex;flex-direction:column;gap:4px;border:1px solid transparent;text-align:left}
.tarjeta .ico{margin-bottom:auto;padding-bottom:12px}
.tarjeta .lbl{font-size:14.5px;opacity:.93;line-height:1.3}
.tarjeta .valor{font-size:clamp(19px,6vw,27px);font-weight:800;letter-spacing:-.02em;word-break:break-word}
.tarjeta .extra{font-size:13px;opacity:.85}
.tarjeta.verde{background:var(--green);color:#fff}
.tarjeta.dorada{background:var(--gold);color:#fff}
.tarjeta.roja{background:var(--red);color:#fff}
.tarjeta.blanca{background:#fff;border-color:var(--line)}
.tarjeta.blanca .valor{color:var(--gold)}
.tarjeta.blanca.num .valor{color:var(--ink)}
.tarjeta.chica{min-height:118px}
/* alertas */
.alerta{width:100%;display:flex;align-items:center;gap:14px;background:#F4F5F1;border:1px solid var(--line);border-radius:20px;padding:16px 18px;margin-bottom:10px;text-align:left}
.alerta .punto{width:12px;height:12px;border-radius:50%;flex:none}
.alerta .al-txt{flex:1;min-width:0}
.alerta .al-txt b{display:block;font-weight:500;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.alerta .al-txt small{color:var(--muted);font-size:14.5px}
.alerta .al-est{font-size:15px;font-weight:500;text-align:right;flex:none;max-width:42%}
.alerta.mora .punto{background:var(--red)}.alerta.mora .al-est{color:var(--red)}
.alerta.mora2 .punto{background:var(--redDark)}.alerta.mora2 .al-est{color:var(--redDark);font-weight:700}
.alerta.hoy{background:var(--greenSoft);border-color:#BFD5C6}.alerta.hoy .punto{background:var(--green)}.alerta.hoy .al-est{color:var(--green);font-weight:700}
.alerta.prox .punto{background:var(--gold)}.alerta.prox .al-est{color:var(--gold)}
.vacio{display:flex;gap:10px;align-items:center;background:#fff;border:1px dashed var(--line);border-radius:20px;padding:18px;color:var(--muted)}
/* cobro / pago card */
.cobro{background:#fff;border:1px solid var(--line);border-radius:22px;padding:18px;margin-bottom:12px}
.cobro .c-top{display:flex;justify-content:space-between;gap:10px}
.cobro .c-top b{font-weight:500;font-size:18px}
.cobro .c-est{font-weight:500;text-align:right;flex:none}
.cobro .c-sub{color:var(--muted);margin-top:4px}
.cobro .c-bot{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-top:14px}
.cobro .c-bot small{color:var(--muted);display:block}
.cobro .btn{white-space:nowrap;flex:none}
.cobro .c-monto{color:var(--gold);font-weight:800;font-size:24px}
.mora-t{color:var(--red)}.mora2-t{color:var(--redDark);font-weight:700}.hoy-t{color:var(--green);font-weight:700}.prox-t{color:var(--gold)}
/* botones */
.btn{border:0;border-radius:999px;padding:13px 22px;font-weight:600;font-size:16px;background:var(--green);color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.grande{width:100%;padding:16px 22px;font-size:17px;margin-top:6px}
.btn.sec{background:#fff;color:var(--green);border:1.5px solid var(--line)}
.btn.oro{background:var(--gold)}
.btn.peligro{background:var(--red)}
.btn.chico{padding:9px 16px;font-size:14.5px}
.btn:disabled{opacity:.5}
.fila-btn{display:flex;gap:10px;margin-top:14px}
.fila-btn .btn{flex:1}
.acciones-ficha{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0 4px}
.acciones-ficha .btn{width:100%;padding:14px 10px}
.chips{display:flex;gap:8px;margin:0 0 14px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 16px;font-weight:500;font-size:14.5px}
.chip.on{background:var(--green);color:#fff;border-color:var(--green)}
/* lista acreedores */
.acr{width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:22px;padding:18px;margin-bottom:12px;display:block}
.acr .a1{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.acr .a1 b{font-size:18px;font-weight:600}
.acr .a2{display:flex;justify-content:space-between;gap:10px;margin-top:10px;align-items:flex-end}
.acr .deuda{font-size:22px;font-weight:800;color:var(--green)}
.acr small{color:var(--muted);font-size:14px}
.pill{display:inline-block;border-radius:999px;padding:4px 11px;font-size:13px;font-weight:600;white-space:nowrap;flex:none}
.pill.ok{background:var(--greenSoft);color:var(--green)}
.pill.mora{background:var(--redSoft);color:var(--red)}
.pill.mora2{background:var(--redDark);color:#fff}
.pill.hoy{background:var(--green);color:#fff}
.pill.prox{background:var(--goldSoft);color:var(--gold)}
.pill.parcial{background:var(--goldSoft);color:var(--gold)}
.pill.gris{background:#ECEEE9;color:var(--muted)}
.pill.liq{background:#E6E3F3;color:#4A3F86}
/* ficha */
.resumen{background:var(--green);color:#fff;border-radius:26px;padding:22px 20px;margin-bottom:12px}
.resumen .r-nom{font-size:22px;font-weight:700;margin:0 0 2px;word-break:break-word}
.resumen .r-lbl{opacity:.85;font-size:14px;margin-top:14px}
.resumen .r-big{font-size:34px;font-weight:800;letter-spacing:-.02em}
.resumen .r-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px;margin-top:16px;padding-top:16px;border-top:1px solid rgba(255,255,255,.18)}
.resumen .r-grid small{display:block;opacity:.78;font-size:13px}
.resumen .r-grid b{font-size:17px;font-weight:700}
.obs{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin-bottom:12px;white-space:pre-wrap}
.aviso{border-radius:18px;padding:14px 16px;margin:0 0 12px;font-size:15px}
.aviso.err{background:var(--redSoft);color:var(--redDark);border:1px solid #EBC3BE}
.aviso.info{background:var(--goldSoft);color:#6E5114;border:1px solid #EAD9B3}
.aviso.ok{background:var(--greenSoft);color:var(--green);border:1px solid #C5D9CB}
.aviso b{display:block;margin-bottom:4px}
.aviso ul{margin:6px 0 0;padding-left:18px}
.per{display:flex;gap:12px;background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:10px}
.per.mora{border-left:5px solid var(--red)}
.per.pagado{border-left:5px solid var(--green2)}
.per.parcial{border-left:5px solid var(--gold)}
.per .chk{width:24px;height:24px;margin-top:2px;accent-color:var(--green);flex:none}
.per-cuerpo{flex:1;min-width:0}
.per-top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.per-top b{font-size:17px}
.per-l{color:var(--muted);font-size:14.5px;margin-top:2px}
.per-l b{color:var(--ink)}
.per-nota{margin-top:8px;background:#F4F5F1;border-radius:12px;padding:8px 12px;font-size:14px;white-space:pre-wrap}
.per-acc{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.mov{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin-bottom:10px}
.mov .m1{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.mov .m1 b{font-weight:600}
.mov .m-tot{font-weight:800;color:var(--green);white-space:nowrap}
.mov .m-l{color:var(--muted);font-size:14px;margin-top:3px}
.mov.anulado{opacity:.6}
.mov.anulado .m1 b,.mov.anulado .m-tot{text-decoration:line-through}
.mov .m-acc{margin-top:10px}
details.plegable{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin-bottom:10px}
details.plegable summary{font-weight:600;cursor:pointer}
.barra-sel{position:fixed;left:0;right:0;bottom:calc(76px + env(safe-area-inset-bottom));padding:10px 18px;z-index:25;display:flex;justify-content:center}
.barra-sel .btn{width:100%;max-width:524px;box-shadow:0 8px 24px rgba(0,0,0,.18)}
/* formularios */
.form label{display:block;font-size:14.5px;color:var(--muted);margin-bottom:14px;font-weight:500}
.form input,.form select,.form textarea{display:block;width:100%;margin-top:6px;border:1.5px solid var(--line);background:#FAFBF8;border-radius:14px;padding:13px 14px;font-size:17px;color:var(--ink);outline:none;min-height:50px}
.form input:focus,.form select:focus,.form textarea:focus{border-color:var(--green2);background:#fff}
.form textarea{min-height:90px;resize:vertical}
.form .dos{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form h3{font-size:20px;margin-bottom:6px}
.form .ayuda{font-size:13.5px;color:var(--muted);margin-top:5px;font-weight:400}
.tasa-fila{display:flex;align-items:center;gap:12px;margin-top:6px}
.tasa-fila input[type=range]{flex:1;accent-color:var(--green);min-height:auto;padding:0;border:0;background:none;margin:0}
.tasa-fila input[type=number]{width:96px;margin:0;text-align:center;font-weight:700}
.prev{background:#F4F5F1;border-radius:16px;padding:14px 16px;margin:4px 0 14px;font-size:15px}
.prev:empty{display:none}
.prev .p-tot{font-size:20px;font-weight:800;color:var(--green)}
.prev ul{margin:6px 0;padding-left:18px}
.prev .err{color:var(--red);font-weight:600}
.prev .adv{color:#8A5B00}
.liq-tabla{width:100%;border-collapse:collapse;font-size:15px;margin:8px 0}
.liq-tabla td{padding:7px 0;border-bottom:1px solid var(--line)}
.liq-tabla td:last-child{text-align:right;font-weight:600}
.liq-tabla tr.total td{border-bottom:0;font-size:19px;font-weight:800;color:var(--green);padding-top:12px}
/* gráfico */
.dona-wrap{display:flex;align-items:center;gap:18px}
.dona-wrap svg{flex:none}
.leyenda div{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:15px}
.leyenda i{width:11px;height:11px;border-radius:50%;display:block;flex:none}
.leyenda b{margin-left:auto;padding-left:8px}
.prox-fila{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left}
.prox-fila:last-child{border-bottom:0}
.prox-fila small{display:block;color:var(--muted);font-size:14px}
.prox-fila .pm{font-weight:700;color:var(--gold);white-space:nowrap}
.mes{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin-bottom:10px}
.mes .mes-t{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.mes .mes-t b{text-transform:capitalize;font-size:17px}
.mes .mes-d{font-weight:800;color:var(--green)}
.mes .mes-g{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;margin-top:8px;font-size:14px;color:var(--muted)}
.mes .mes-g span b{color:var(--ink);font-weight:600}
.barras{width:100%;height:auto;display:block}
.ajuste{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.ajuste:last-child{border-bottom:0}
.ajuste small{display:block;color:var(--muted);font-size:13.5px}
/* bloqueo */
.bloqueo{min-height:88vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding-top:20px}
.bloqueo .logo{width:92px;height:92px}
.bloqueo h1{font-size:36px;color:var(--green);margin:12px 0 0;font-weight:800;letter-spacing:-.02em}
.bloqueo .form{width:100%;max-width:400px;text-align:left;margin-top:24px}
.bloqueo .btn.sec{margin-top:10px}
/* navegación inferior */
nav.abajo{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 4px calc(10px + env(safe-area-inset-bottom));z-index:20}
nav.abajo:empty{display:none}
nav.abajo button{flex:1;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--muted);font-weight:500;font-size:12.5px;position:relative;padding:4px 0;min-width:0}
nav.abajo button.on{color:var(--green);font-weight:700}
nav.abajo .badge{position:absolute;top:-6px;left:calc(50% + 2px);background:var(--red);color:#fff;border-radius:11px;min-width:22px;height:22px;font-size:12.5px;display:grid;place-items:center;padding:0 6px;font-weight:600}
/* hoja inferior */
#hoja{position:fixed;inset:0;z-index:50;display:none}
#hoja.on{display:block}
.hoja-fondo{position:absolute;inset:0;background:rgba(15,25,20,.45)}
.hoja{position:absolute;left:0;right:0;bottom:0;max-height:92vh;overflow:auto;background:#fff;border-radius:26px 26px 0 0;padding:12px 20px calc(24px + env(safe-area-inset-bottom));max-width:600px;margin:0 auto}
.hoja .asa{width:44px;height:5px;border-radius:3px;background:#D6DAD2;margin:0 auto 14px}
.hoja h3{font-size:21px;margin-bottom:8px}
.hoja p{color:var(--muted);margin:0 0 14px}
.hoja .form{padding:0;border:0;margin:0}
#toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;font-size:15px;opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
@media (max-width:370px){#app{padding:10px 14px}.marca h1{font-size:26px}.redondo{width:40px;height:40px}.pill-al{height:40px;padding:0 11px}}
</style>
</head>
<body>
<div id="app"><div class="bloqueo"><p class="muted">Cargando…</p></div></div>
<nav id="nav" class="abajo"></nav>
<div id="hoja"></div>
<div id="toast"></div>

<!-- ===================== MOTOR DE CÁLCULO ===================== -->
<script id="motor">
/* Todos los montos se manejan en CENTAVOS (números enteros) para evitar errores de redondeo.
   Las fechas son textos AAAA-MM-DD. */
var Motor = (function () {
  var pad = function (n) { return String(n).padStart(2, '0'); };
  var parse = function (s) { return s.split('-').map(Number); };
  var dim = function (y, m) { return new Date(Date.UTC(y, m, 0)).getUTCDate(); };
  var num = function (s) { var p = parse(s); return Math.round(Date.UTC(p[0], p[1] - 1, p[2]) / 864e5); };
  var diff = function (a, b) { return num(a) - num(b); };
  var iso = function (y, m, d) { return y + '-' + pad(m) + '-' + pad(d); };
  var suma = function (arr, f) { return arr.reduce(function (s, x) { return s + (typeof f === 'string' ? (x[f] || 0) : f(x)); }, 0); };

  function fmt(c) {
    var neg = c < 0; c = Math.abs(Math.round(c));
    var e = Math.floor(c / 100), d = c % 100;
    return (neg ? '-' : '') + '$' + String(e).replace(/\B(?=(\d{3})+(?!\d))/g, '.') + ',' + pad(d);
  }
  function fmtTasa(t) { return String(t).replace('.', ',') + '%'; }

  /* Fecha de vencimiento del mes k (k = 1, 2, 3…). Mismo "día de pago" cada mes;
     si el mes no tiene ese día (ej. 31 en febrero) se usa el último día del mes. */
  function vencimiento(fechaRec, diaPago, k) {
    var p = parse(fechaRec), t = p[1] - 1 + k;
    var y = p[0] + Math.floor(t / 12), m = (t % 12) + 1;
    return iso(y, m, Math.min(diaPago, dim(y, m)));
  }
  function inicioPeriodo(a, k) { return k === 1 ? a.fechaRecepcion : vencimiento(a.fechaRecepcion, a.diaPago, k - 1); }
  function ordenar(x, y) { return x.fecha < y.fecha ? -1 : x.fecha > y.fecha ? 1 : (x.creado || 0) - (y.creado || 0); }

  /* Cálculo completo de un acreedor a partir de sus movimientos (nunca se guardan "meses"). */
  function calcular(a, movsAll, hoy) {
    var movs = movsAll.filter(function (m) { return m.acreedorId === a.id; });
    var validos = movs.filter(function (m) { return !m.anulado; });
    var pagos = validos.filter(function (m) { return m.tipo === 'pago'; });
    var tasas = validos.filter(function (m) { return m.tipo === 'tasa'; }).sort(ordenar);
    var abonos = pagos.filter(function (p) { return p.capital > 0; });

    var capitalEn = function (f) { return a.capital - suma(abonos.filter(function (p) { return p.fecha <= f; }), 'capital'); };
    var tasaEn = function (f) { var t = a.tasa; tasas.forEach(function (x) { if (x.fecha <= f) t = x.tasa; }); return t; };

    var asig = {}, fechaPago = {};
    pagos.forEach(function (p) {
      (p.asignaciones || []).forEach(function (s) {
        asig[s.periodo] = (asig[s.periodo] || 0) + s.monto;
        if (!fechaPago[s.periodo] || p.fecha > fechaPago[s.periodo]) fechaPago[s.periodo] = p.fecha;
      });
    });
    var maxAsig = Math.max.apply(null, [0].concat(Object.keys(asig).map(Number)));

    var periodos = [];
    for (var k = 1; k <= 1200; k++) {
      var inicio = inicioPeriodo(a, k);
      if (inicio > hoy && k > maxAsig) break;          // solo hasta el mes en curso
      var cap = capitalEn(inicio);                         // capital vigente al INICIO del mes
      if (cap <= 0) break;                                 // deuda saldada: no hay más meses
      var vence = vencimiento(a.fechaRecepcion, a.diaPago, k);
      var tasa = tasaEn(inicio);
      var interes = Math.round(cap * tasa / 100);
      var pagado = asig[k] || 0;

function filaPeriodo(p) {
  const h = hoy(); let pc, pt, cls = '';

  else if (p.alerta === 'mora') { pc = p.diasMora > 7 ? 'mora2' : 'mora'; pt = `${p.estado === 'parcial' ? 'Parcial · ' : ''}Mora ${plural(p.diasMora, 'día', 'días')}`; cls = 'mora'; }
  else if (p.alerta === 'hoy') { pc = 'hoy'; pt = p.estado === 'parcial' ? 'Parcial · vence hoy' : 'Vence hoy'; cls = p.estado === 'parcial' ? 'parcial' : ''; }
  else if (p.alerta === 'proximo') { pc = 'prox'; pt = `${p.estado === 'parcial' ? 'Parcial · ' : ''}Vence en ${plural(Motor.diff(p.vence, h), 'día', 'días')}`; cls = p.estado === 'parcial' ? 'parcial' : ''; }
  else { pc = p.estado === 'parcial' ? 'parcial' : 'gris'; pt = p.estado === 'parcial' ? 'Parcial · en curso' : 'En curso'; cls = p.estado === 'parcial' ? 'parcial' : ''; }
  const puedeSel = S.bulk && p.saldo > 0 && p.vence <= h;
  return `<div class="per ${cls}">${puedeSel ? `<input type="checkbox" class="chk" data-a="sel" data-n="${p.n}" ${S.sel.has(p.n) ? 'checked' : ''} aria-label="Seleccionar mes ${p.n}">` : ''}

  ${p.pagado ? `<div class="per-l">Pagado ${fmt(p.pagado)}${p.fechaPago ? ` · el ${fmtF(p.fechaPago)}` : ''}${p.diasRetraso != null ? ` · <b style="color:${p.diasRetraso ? 'var(--gold)' : 'var(--green)'}">${txtRetraso(p.diasRetraso)}</b>` : ''}${p.saldo > 0 ? ` · <span class="rojo">falta ${fmt(p.saldo)}</span>` : ''}</div>` : ''}
  ${p.nota ? `<div class="per-nota">${esc(p.nota)}</div>` : ''}
  ${S.bulk ? '' : `<div class="per-acc">${p.saldo > 0 ? `<button class="btn chico" data-a="marcar" data-n="${p.n}">${p.pagado ? 'Pagar saldo' : 'Marcar pagado'}</button>` : ''}<button class="btn chico sec" data-a="nota" data-n="${p.n}">${p.nota ? 'Editar nota' : 'Nota'}</button></div>`}
  </div></div>`;
}
function filaMov(m, conNombre = false) {

function previaAcreedor(form) {
  const el = form.querySelector('#prevAcr'); if (!el) return;

function vistaHistorial() {
  const D = datos(); const tab = (v, t) => `<button class="chip ${S.histTab === v ? 'on' : ''}" data-a="histTab" data-v="${v}">${t}</button>`;
  let cuerpo = '';

    if (S.histAcr) movs = movs.filter(m => m.acreedorId === S.histAcr);
    if (S.histTipo === 'interes') movs = movs.filter(m => m.interes > 0);
    if (S.histTipo === 'capital') movs = movs.filter(m => m.capital > 0);
    movs.sort((x, y) => x.fecha < y.fecha ? 1 : x.fecha > y.fecha ? -1 : (y.creado || 0) - (x.creado || 0));
    const ok = movs.filter(m => !m.anulado);
    cuerpo = `<div class="form" style="display:grid;grid-template-columns:1.3fr 1fr;gap:10px">
      <label>Acreedor<select data-filtro="histAcr"><option value="">Todos</option>${D.filas.map(f => `<option value="${f.a.id}" ${S.histAcr === f.a.id ? 'selected' : ''}>${esc(f.a.nombre)}</option>`).join('')}</select></label>
      <label>Tipo<select data-filtro="histTipo"><option value="">Todos</option><option value="interes" ${S.histTipo === 'interes' ? 'selected' : ''}>Intereses</option><option value="capital" ${S.histTipo === 'capital' ? 'selected' : ''}>Capital</option></select></label></div>

      ${movs.length ? movs.map(m => filaMov(m, true)).join('') : '<div class="vacio">No hay pagos con estos filtros.</div>'}`;

    cuerpo = ev.length ? `<div class="card"><b>Capital que debía al cierre de cada mes</b><svg class="barras" viewBox="0 0 300 140" style="margin-top:10px">${barras}</svg></div>
      ${ev.slice().reverse().map(x => `<div class="mes"><div class="mes-t"><b>${fmtMes(x.mes)}</b><span class="mes-d">${fmt(x.deuda)}</span></div><div class="muted chico">Capital adeudado al cierre</div>
      <div class="mes-g"><span>Interés generado <b>${fmt(x.generado)}</b></span><span>Interés pagado <b>${fmt(x.interesPagado)}</b></span><span>Capital abonado <b>${fmt(x.capitalAbonado)}</b></span><span>Capital recibido <b>${fmt(x.recibido)}</b></span></div></div>`).join('')}` : '<div class="vacio">Sin datos todavía.</div>';
  } else if (S.histTab === 'pendientes') {

  } else {
    cuerpo = D.liq.length ? D.liq.map(({ a, r }) => `<button class="acr" data-a="ficha" data-id="${a.id}"><div class="a1"><b>${esc(a.nombre)}</b><span class="pill liq">Liquidado</span></div><div class="a2"><div><small>Capital liberado</small><div class="deuda">${fmt(a.capital)}</div></div><div style="text-align:right"><small>${r.fechaCancelacion ? fmtF(r.fechaCancelacion) : ''}</small><br><small>Intereses pagados ${fmt(r.interesPagado)}</small></div></div></button>`).join('')

/* ---------- formularios ---------- */
const FORM = {
  async crearClave(f, fd) {
    const p1 = fd.get('p1'), p2 = fd.get('p2');
    if (p1.length < 4) throw new Error('La contraseña debe tener al menos 4 caracteres.');
    if (p1 !== p2) throw new Error('Las contraseñas no coinciden.');
    await crearClave(p1); await desbloquear();
    if (await huellaDisponible()) {
      abrirHoja(`<h3>¿Activar la huella digital?</h3><p>Podrás entrar con tu huella. La contraseña seguirá funcionando siempre.</p><div class="fila-btn"><button class="btn sec" data-a="cerrarHoja">Ahora no</button><button class="btn" id="hSi">${ic(I.fp, 18)} Activar</button></div>`);
      $('#hSi').onclick = async () => { cerrarHoja(); await activarHuella(); };
    }
  },
  async entrar(f, fd) {
    if (Date.now() < S.bloqueoHasta) throw new Error(`Demasiados intentos. Espera ${Math.ceil((S.bloqueoHasta - Date.now()) / 1000)} segundos.`);
    if (await verificarClave(fd.get('p'))) { await desbloquear(); return; }
    S.intentos++; if (S.intentos >= 5) { S.bloqueoHasta = Date.now() + 30000; S.intentos = 0; }
    f.querySelector('input').value = ''; throw new Error('Contraseña incorrecta');
  },
  async acreedor(f, fd) {
    const ed = S.vista === 'editar';
    const nombre = String(fd.get('nombre')).trim(); const capital = leerMonto(fd.get('capital')); const tasa = Number(String(fd.get('tasa')).replace(',', '.'));
    const fecha = fd.get('fecha'); const dia = Number(fd.get('dia')); const obs = String(fd.get('obs') || '').trim();
    if (!nombre) throw new Error('Escribe el nombre.');
    if (!(capital > 0)) throw new Error('Escribe un capital válido.');
    if (!tasaValida(tasa)) throw new Error('La tasa debe estar entre 2% y 10%.');
    if (!fecha || fecha > hoy()) throw new Error('La fecha no puede ser futura.');
    if (!(dia >= 1 && dia <= 31 && Number.isInteger(dia))) throw new Error('El día de pago debe ser un número entre 1 y 31.');
    if (ed) {
      const a = { ...S.acreedores.find(x => x.id === S.fichaId) }; const cambios = [...(a.cambios || [])];
      const reg = (campo, antes, despues) => { if (String(antes) !== String(despues)) cambios.push({ fecha: hoy(), ts: Date.now(), campo, antes, despues }); };
      reg('Nombre', a.nombre, nombre); reg('Capital original', fmt(a.capital), fmt(capital)); reg('Tasa inicial', fmtTasa(a.tasa), fmtTasa(tasa));
      reg('Fecha de recepción', a.fechaRecepcion, fecha); reg('Día de pago', a.diaPago, dia); reg('Observaciones', a.obs || '—', obs || '—');
      const fuertes = a.capital !== capital || a.tasa !== tasa || a.fechaRecepcion !== fecha || a.diaPago !== dia;
      if (fuertes && !(await confirmar({ titulo: 'Recalcular historial', texto: 'Estos cambios recalculan las mensualidades de este acreedor. Los pagos registrados se mantienen. ¿Continuar?', ok: 'Sí, guardar' }))) return;
      Object.assign(a, { nombre, capital, tasa, fechaRecepcion: fecha, diaPago: dia, obs, cambios });
      await guardarAcr(a); history.back(); toast('Datos actualizados');
    } else {
      if (S.acreedores.some(x => x.nombre.toLowerCase() === nombre.toLowerCase()) && !(await confirmar({ titulo: 'Nombre repetido', texto: `Ya existe un acreedor llamado “${esc(nombre)}”. ¿Crear otro de todas formas?`, ok: 'Crear' }))) return;
      const a = { id: uid(), nombre, capital, tasa, fechaRecepcion: fecha, diaPago: dia, obs, notas: {}, cambios: [], creado: Date.now() };
      await guardarAcr(a);
      S.vista = 'ficha'; S.fichaId = a.id; history.replaceState({ vista: 'ficha', fichaId: a.id }, ''); render(); window.scrollTo(0, 0);
      const venc = datos().porId[a.id].r.periodos.filter(p => p.vence <= hoy()).length;
      if (venc) abrirHoja(`<h3>Acreedor creado</h3><p>Se generaron <b>${plural(venc, 'mensualidad vencida', 'mensualidades vencidas')}</b>, todas como <b>PENDIENTES</b>.</p><p>Ahora reconstruye el historial:<br>1. Si hiciste abonos a capital, regístralos primero con “Registrar pago” y su fecha real.<br>2. Usa “Marcar varios” para marcar los meses que pagaste a tiempo, o “Marcar pagado” en cada mes para poner la fecha y el monto exactos.</p><button class="btn grande" data-a="cerrarHoja">Entendido</button>`);
      else toast('Acreedor guardado');
    }
  },
  async pago(f) {
    const R = leerPago(f); if (R.error) throw new Error(R.error);
    const m = { ...R.pago, id: uid(), creado: Date.now() };
    await guardarMov(m); S.pre = null;
    toast('Pago registrado'); S.vista = 'ficha'; S.fichaId = R.a.id; history.replaceState({ vista: 'ficha', fichaId: R.a.id }, ''); render(); window.scrollTo(0, 0);
  },
  async marcar(f, fd) {
    const fi = fichaActual(); const n = Number(f.dataset.n); const p = fi.r.periodos.find(x => x.n === n);
    const monto = leerMonto(fd.get('monto')); const fecha = fd.get('fecha');
    if (!(monto > 0)) throw new Error('Escribe un monto válido.');
    if (monto > p.saldo) throw new Error(`El monto supera lo que falta de este mes (${fmt(p.saldo)}).`);
    if (!fecha || fecha > hoy()) throw new Error('La fecha no puede ser futura.');
    if (fecha < fi.a.fechaRecepcion) throw new Error('La fecha es anterior a la recepción del préstamo.');
    await guardarMov({ id: uid(), tipo: 'pago', acreedorId: fi.a.id, fecha, interes: monto, capital: 0, asignaciones: [{ periodo: n, monto }], obs: String(fd.get('obs') || '').trim(), creado: Date.now() });
    cerrarHoja(); render(); toast(monto === p.saldo ? `Mes ${n} pagado` : `Pago parcial registrado en el Mes ${n}`);
  },
  async nota(f, fd) {
    const a = { ...fichaActual().a }; a.notas = { ...(a.notas || {}) }; const t = String(fd.get('nota') || '').trim(); const n = f.dataset.n;
    if (t) a.notas[n] = t; else delete a.notas[n];
    await guardarAcr(a); cerrarHoja(); render(); toast('Nota guardada');
  },
  async anular(f, fd) {
    const m = { ...S.movs.find(x => x.id === f.dataset.id), anulado: true, anuladoEn: hoy(), motivo: String(fd.get('motivo')).trim() };
    await guardarMov(m); cerrarHoja(); render(); toast('Movimiento anulado');
  },
  async tasa(f, fd) {
    const t = Number(String(fd.get('tasa')).replace(',', '.')); if (!tasaValida(t)) throw new Error('La tasa debe estar entre 2% y 10%.');
    const fi = fichaActual();
    await guardarMov({ id: uid(), tipo: 'tasa', acreedorId: fi.a.id, fecha: fd.get('desde'), tasa: t, obs: String(fd.get('obs') || '').trim(), creado: Date.now() });
    cerrarHoja(); render(); toast(`Nueva tasa ${fmtTasa(t)} desde ${fmtF(fd.get('desde'))}`);
  },
  async liquidar(f, fd) {
    const fi = fichaActual(); const L = Motor.liquidacion(fi.a, S.movs, fd.get('fecha'), hoy());
    if (L.error) throw new Error(L.error);
    const ok = await confirmar({ titulo: 'Confirmar liquidación', texto: `Registrarás un pago final de <b>${fmt(L.total)}</b> a ${esc(fi.a.nombre)} (capital ${fmt(L.capital)} + intereses ${fmt(L.interes)}).`, ok: 'Liquidar' });
    if (!ok) return;
    await guardarMov({ ...L.pago, id: uid(), obs: String(fd.get('obs') || '').trim(), creado: Date.now() });
    render(); window.scrollTo(0, 0);
    abrirHoja(`<h3>✔ Deuda liquidada</h3><p>${esc(fi.a.nombre)} quedó como <b>CANCELADO</b>. Todo el historial se conservó.</p><div class="aviso ok">El capital de <b>${fmt(fi.a.capital)}</b> que antes pertenecía a ${esc(fi.a.nombre)} ya no es una obligación. Pasa a formar parte de tu capital propio, siempre que esos fondos sigan disponibles o invertidos.</div>
      <div class="fila-btn"><button class="btn sec" data-a="cerrarHoja">Cerrar</button><button class="btn" id="sumarPropio">Sumar ${fmt(fi.a.capital)} a mi capital propio</button></div>`);
    $('#sumarPropio').onclick = async () => { await setAj('capitalPropio', (S.aj.capitalPropio || 0) + fi.a.capital); cerrarHoja(); render(); toast('Capital propio actualizado'); };
  },
  async capitalPropio(f, fd) { const m = leerMonto(fd.get('monto')); if (isNaN(m)) throw new Error('Monto no válido.'); await setAj('capitalPropio', m); CV++; cerrarHoja(); render(); toast('Capital propio guardado'); },
  async cambiarClave(f, fd) {
    if (!(await verificarClave(fd.get('a')))) throw new Error('La contraseña actual no es correcta.');
    if (fd.get('p1').length < 4) throw new Error('Mínimo 4 caracteres.'); if (fd.get('p1') !== fd.get('p2')) throw new Error('Las contraseñas nuevas no coinciden.');
    await crearClave(fd.get('p1')); cerrarHoja(); toast('Contraseña cambiada');
  }
};

/* ---------- respaldo ---------- */
function datosRespaldo() { return { app: 'control-acreedores', version: 1, exportado: new Date().toISOString(), nota: 'Montos en centavos', acreedores: S.acreedores, movimientos: S.movs, ajustes: { capitalPropio: S.aj.capitalPropio ?? null, autoLock: S.aj.autoLock ?? 3 } }; }
const nombreRespaldo = () => `control-respaldo-${hoy()}.json`;
async function descargarRespaldo() {
  const blob = new Blob([JSON.stringify(datosRespaldo(), null, 1)], { type: 'application/json' });
  const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = nombreRespaldo();
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 3000);
  await setAj('ultimoRespaldo', new Date().toISOString()); render(); toast('Respaldo descargado. Guárdalo fuera del teléfono.');
}
async function compartirRespaldo() {
  const file = new File([JSON.stringify(datosRespaldo(), null, 1)], nombreRespaldo(), { type: 'application/json' });
  if (!navigator.canShare || !navigator.canShare({ files: [file] })) { descargarRespaldo(); return; }
  try { await navigator.share({ files: [file], title: 'Respaldo Control' }); await setAj('ultimoRespaldo', new Date().toISOString()); render(); } catch { }
}
function validarRespaldo(d) {
  if (!d || d.app !== 'control-acreedores' || !Array.isArray(d.acreedores) || !Array.isArray(d.movimientos)) throw new Error('El archivo no es un respaldo de Control.');
  d.acreedores.forEach(a => { if (!a.id || !a.nombre || !Number.isInteger(a.capital) || !/^\d{4}-\d\d-\d\d$/.test(a.fechaRecepcion) || !(a.diaPago >= 1 && a.diaPago <= 31) || !(a.tasa > 0)) throw new Error('El respaldo tiene un acreedor con datos dañados.'); });
  const ids = new Set(d.acreedores.map(a => a.id));
  d.movimientos.forEach(m => { if (!m.id || !ids.has(m.acreedorId) || !/^\d{4}-\d\d-\d\d$/.test(m.fecha)) throw new Error('El respaldo tiene movimientos dañados.'); });
}
document.addEventListener('change', async e => {
  if (e.target.id !== 'archivoRespaldo' || !e.target.files[0]) return;
  try {
    const d = JSON.parse(await e.target.files[0].text()); validarRespaldo(d);
    const ok = await confirmar({ titulo: 'Restaurar respaldo', texto: `El respaldo del <b>${esc((d.exportado || '').slice(0, 10))}</b> tiene ${plural(d.acreedores.length, 'acreedor', 'acreedores')} y ${plural(d.movimientos.length, 'movimiento', 'movimientos')}. <b>Reemplazará</b> los datos actuales (se guarda una copia interna de los actuales por seguridad). Tu contraseña no cambia.`, ok: 'Restaurar', peligro: true });
    if (!ok) return;
    await DB.put('respaldos', { id: new Date().toISOString(), datos: datosRespaldo() });
    const extra = {}; if (d.ajustes) { if (d.ajustes.capitalPropio != null) extra.capitalPropio = d.ajustes.capitalPropio; if (d.ajustes.autoLock) extra.autoLock = d.ajustes.autoLock; }
    await DB.reemplazar(d.acreedores, d.movimientos, extra); Object.assign(S.aj, extra);
    await cargarDatos(); ir('inicio'); toast('Respaldo restaurado');
  } catch (err) { toast(err.message || 'No se pudo leer el archivo.'); }
});

/* ---------- eventos globales ---------- */
document.addEventListener('click', async e => {
  const el = e.target.closest('[data-a]'); if (!el) return;
  const fn = ACC[el.dataset.a]; if (!fn) return;
  if (el.tagName !== 'INPUT') e.preventDefault();
  try { await fn(el.dataset, el); } catch (err) { console.error(err); toast(err.message || 'Ocurrió un error'); }
});
document.addEventListener('submit', async e => {
  const f = e.target; const fn = FORM[f.dataset.form]; if (!fn) return;
  e.preventDefault(); const b = f.querySelector('button:not([type=button])'); if (b) b.disabled = true;
  try { await fn(f, new FormData(f)); } catch (err) { toast(err.message || 'Ocurrió un error'); } finally { if (b && b.isConnected) b.disabled = false; }
});
document.addEventListener('input', e => {
  const t = e.target; const f = t.closest('form');
  if (t.dataset.filtro) return;
  if (f && f.dataset.form === 'pago') { if (t.name === 'acr') { S.pre = { acrId: t.value }; render(); return; } previaPago(f); }
  if (f && f.dataset.form === 'acreedor') {
    if (t.name === 'tasaR') f.tasa.value = t.value;
    if (t.name === 'tasa' && tasaValida(Number(t.value))) f.tasaR.value = t.value;
    if (t.name === 'dia') t.dataset.tocado = '1';
    if (t.name === 'fecha' && f.dia.dataset.tocado !== '1' && t.value) f.dia.value = Number(t.value.slice(8));
    previaAcreedor(f);
  }
  if (f && f.dataset.form === 'liquidar' && t.name === 'fecha') previaLiq(f);
});
document.addEventListener('change', async e => {
  const t = e.target; if (!t.dataset.filtro) return;
  if (t.dataset.filtro === 'autoLock') { await setAj('autoLock', Number(t.value)); toast('Guardado'); return; }
  S[t.dataset.filtro] = t.value; render();
});

/* ---------- inicio ---------- */
(async function iniciar() {
  try {
    if (!window.indexedDB) throw new Error('Este navegador no permite guardar datos.');
    await DB.abrir();
    (await DB.all('ajustes')).forEach(x => { S.aj[x.clave] = x.valor; });
    S.listo = true; history.replaceState({ vista: 'inicio' }, ''); render();
  } catch (e) { $('#app').innerHTML = `<div class="aviso err" style="margin-top:40px"><b>No se pudo abrir el almacenamiento</b>${esc(e.message || e)}. Abre la app en Chrome (no en modo incógnito).</div>`; }
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('./sw.js', { scope: './' }).catch(() => { });
})();
</script>
